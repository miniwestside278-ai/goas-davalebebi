<!-- 1. რა არის HTML და რისთვის გამოიყენება? -->
<!-- HTML (HyperText Markup Language) არის ვებ-გვერდების ჩონჩხი (სტრუქტურა). ის არ არის დაპროგრამების ენა, არამედ მარკირების ენაა, რომელიც ბრაუზერს ეუბნება, თუ როგორ გამოაჩინოს კონტენტი ვებ-გვერდზე (მაგალითად: სად არის ტექსტის სათაური, სად პარაგრაფი, სად სურათი, ღილაკი ან ბმული). -->

<!--  2. რა განსხვავებაა Empty და Container თეგებს შორის?
Container (კონტეინერი) თეგები: ეს არის თეგები, რომლებსაც აქვთ როგორც გახსნითი, ასევე დახურვითი თეგი (მაგალითად: <p>...</p>, <h1>...</h1>). მათ შიგნით თავსდება ტექსტი ან სხვა თეგები.

Empty (ცარიელი / თვითდახურვადი) თეგები: ეს თეგები არ შეიცავენ ტექსტს თავის შიგნით და არ სჭირდებათ ცალკე დახურვითი თეგი (მაგალითად: <br> - ახალ ხაზზე გადაყვანა, <img> - სურათის ჩასმა).-->

<!--  3. რა განსხვავებაა Frontend-სა და Backend-ს შორის?
Frontend (ფრონტენდი): ვებ-საიტის ის ნაწილი, რასაც მომხმარებელი ხედავს და ურთერთქმედებს მასთან (დიზაინი, ღილაკები, ტექსტი, ანიმაციები). იქმნება HTML, CSS და JavaScript-ის საშუალებით.

Backend (ბექენდი): ვებ-საიტის "კულისებს მიღმა" არსებული ლოგიკა, რომელიც მომხმარებლისთვის უხილავია (სერვერები, მონაცემთა ბაზები, ავტორიზაციის სისტემა). ის პასუხისმგებელია მონაცემების შენახვასა და დამუშავებაზე (მაგალითად, Python, PHP, Node.js და ა.შ.).-->
